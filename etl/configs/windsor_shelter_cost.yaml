# Dataset config for etl/etl_framework.py -- the wide Windsor shelter-cost
# staging extract (data/staging/windsor_shelter_cost.csv, produced by
# etl/extract_windsor_shelter_cost.py). expected_columns is the renamed
# (snake_case) set, matching load_windsor_shelter_cost_to_postgres.py's own
# COLUMN_RENAME map, so both loaders agree on this table's real shape.
name: windsor_shelter_cost
csv_path: data/staging/windsor_shelter_cost.csv
schema: public
table: windsor_shelter_cost
column_rename:
  REF_DATE: ref_date
  GEO: geo
  DGUID: dguid
  "Household total income groups (14)": income_group
  "Household type including census family structure (16)": household_type
  "Housing suitability (3)": housing_suitability
  "Dwelling condition (3)": dwelling_condition
  "Statistics (3C)": statistic
  "Shelter-cost-to-income ratio (5)": shelter_cost_ratio
  Coordinate: coordinate
  "Tenure (3):Total - Tenure[1]": tenure_total
  Symbol: tenure_total_symbol
  "Tenure (3):Owner[2]": tenure_owner
  Symbol.1: tenure_owner_symbol
  "Tenure (3):Renter[3]": tenure_renter
  Symbol.2: tenure_renter_symbol
expected_columns:
  - ref_date
  - geo
  - dguid
  - income_group
  - household_type
  - housing_suitability
  - dwelling_condition
  - statistic
  - shelter_cost_ratio
  - coordinate
  - tenure_total
  - tenure_total_symbol
  - tenure_owner
  - tenure_owner_symbol
  - tenure_renter
  - tenure_renter_symbol
numeric_columns:
  - tenure_total
  - tenure_owner
  - tenure_renter
