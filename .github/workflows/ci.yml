name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  pre-commit-hygiene:
    name: pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1

  python-tests:
    name: pytest (etl)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run pytest
        working-directory: etl
        run: python -m pytest test_affordability_etl.py -v
      - name: Run pytest (schema guard and scheduled refresh)
        working-directory: etl
        run: python -m pytest test_scheduled_refresh.py -v
      - name: Run pytest (Story 5 peer-city extract)
        working-directory: etl
        run: python -m pytest test_peer_cma_context.py -v
      - name: Run pytest (dashboard tabs)
        working-directory: etl
        run: python -m pytest test_dashboard_tabs.py -v
      - name: Run pytest (website highlights export)
        working-directory: etl
        run: python -m pytest test_site_highlights.py -v
      - name: Run pytest (guest-token API)
        working-directory: api
        run: python -m pytest test_guest_token_server.py -v

  web-lint-and-build:
    name: web lint + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Build
        run: npm run build
