# The website on whva.cs.uwindsor.ca: HTTPS with the university's
# certificate, the React build, and /api forwarded to the guest-token API.
# Install as /etc/nginx/sites-available/whva (docs/production_hardening.md, section 6).

# Plain HTTP only redirects to HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name whva.cs.uwindsor.ca;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name whva.cs.uwindsor.ca;

    # Certificate provided by the university (renewed by them; valid to Feb 2027).
    ssl_certificate     /etc/ssl/certs/whva/fullchain.pem;
    ssl_certificate_key /etc/ssl/certs/whva/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;

    server_tokens off;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Nobody may frame the site; the site itself frames dashboards from apss.
    add_header Content-Security-Policy "frame-ancestors 'self'" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Guest-token API (systemd unit whva-token-api.service), local only.
    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # React build (web/dist); unknown paths load the app, which routes them.
    root /var/www/whva;
    location / {
        try_files $uri /index.html;
    }
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
