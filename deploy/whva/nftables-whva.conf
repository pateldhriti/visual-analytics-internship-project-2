#!/usr/sbin/nft -f
# Host firewall for whva (Debian's nftables). Incoming: only SSH, HTTP
# (redirects to HTTPS) and HTTPS. Outgoing is unrestricted (PostgreSQL on
# psql.cs.uwindsor.ca, apss, package updates).
# Install as /etc/nftables.conf only after the admin agrees, and test it
# with a rollback first (docs/production_hardening.md, section 6).

flush ruleset

table inet filter {
    chain input {
        type filter hook input priority filter; policy drop;

        iif "lo" accept
        ct state established,related accept
        ct state invalid drop

        # Ping and IPv6 neighbour discovery
        meta l4proto { icmp, ipv6-icmp } accept

        tcp dport 22 accept          # SSH (on the VPN / campus network)
        tcp dport { 80, 443 } accept # website
    }

    chain forward {
        type filter hook forward priority filter; policy drop;
    }

    chain output {
        type filter hook output priority filter; policy accept;
    }
}
